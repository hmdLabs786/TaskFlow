name: tsg_appdev_p01_todo
description: A Flutter Todo application

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  provider: ^6.1.2
  cupertino_icons: ^1.0.8
  flutter_local_notifications: ^17.1.2
  timezone: ^0.9.2
  flutter_quill: ^11.6.0
  image_picker: ^1.1.2
  file_picker: ^8.1.2
  share_plus: ^10.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.9
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "TaskFlow_app_logo_design_20260912140615.jpeg"
  adaptive_icon_background: "#1A73E8"
  adaptive_icon_foreground: "TaskFlow_app_logo_design_20260912140615.jpeg"

flutter:
  uses-material-design: true
  assets:
    - TaskFlow_app_logo_design_20260912140615.jpeg